<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>JARVIS</title>
  <style>
    :root {
      --bg: #05080f;
      --panel: #0a101c;
      --border: #1a2a44;
      --accent: #00d4ff;
      --text: #e8f4ff;
      --text-dim: #8ba3b8;
      --success: #00e676;
      --danger: #ff4d6a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%;
      height: 100dvh;
      height: -webkit-fill-available;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      overscroll-behavior: none;
      background-image: 
        radial-gradient(ellipse at 20% 20%, rgba(0, 212, 255, 0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(0, 100, 200, 0.05) 0%, transparent 50%);
    }

    header {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: rgba(10, 16, 28, 0.9);
      backdrop-filter: blur(12px);
      flex-shrink: 0;
      z-index: 10;
    }

    .logo { display: flex; align-items: center; gap: 10px; }

    .logo-icon {
      width: 36px; height: 36px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #0066ff);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 15px; color: #000;
      box-shadow: 0 0 16px rgba(0, 212, 255, 0.4);
    }

    .logo-text h1 { font-size: 17px; font-weight: 600; letter-spacing: 2px; }
    .logo-text span { font-size: 10px; color: var(--text-dim); letter-spacing: 1px; }

    .header-right { display: flex; align-items: center; gap: 8px; }

    .status-badge {
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; color: var(--text-dim);
      background: rgba(0, 212, 255, 0.08);
      padding: 5px 10px; border-radius: 20px;
      border: 1px solid rgba(0, 212, 255, 0.15);
    }

    .status-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--success); box-shadow: 0 0 6px var(--success);
    }
    .status-dot.listening { background: var(--accent); box-shadow: 0 0 6px var(--accent); animation: blink 1s infinite; }
    .status-dot.thinking { background: #ffaa00; box-shadow: 0 0 6px #ffaa00; animation: blink 0.5s infinite; }
    .status-dot.speaking { background: #a855f7; box-shadow: 0 0 6px #a855f7; animation: blink 0.8s infinite; }
    .status-dot.error { background: var(--danger); box-shadow: 0 0 6px var(--danger); }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

    .btn-icon {
      width: 36px; height: 36px; border-radius: 50%;
      border: 1px solid var(--border); background: var(--panel);
      color: var(--text-dim); display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .btn-icon:active { transform: scale(0.92); }
    .btn-icon svg { width: 18px; height: 18px; }

    #chat {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      padding: 16px 14px; display: flex; flex-direction: column; gap: 12px;
      scroll-behavior: smooth; -webkit-overflow-scrolling: touch; min-height: 0;
    }

    .message {
      max-width: 90%; padding: 11px 14px; border-radius: 16px;
      line-height: 1.45; font-size: 15px; animation: fadeIn 0.25s ease;
      word-wrap: break-word; white-space: pre-wrap;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .message.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #0066cc, #0099ff);
      color: white; border-bottom-right-radius: 5px;
    }
    .message.jarvis {
      align-self: flex-start;
      background: var(--panel); border: 1px solid var(--border);
      border-bottom-left-radius: 5px;
    }
    .message.jarvis .label {
      font-size: 10px; color: var(--accent); margin-bottom: 3px;
      font-weight: 600; letter-spacing: 1px;
    }
    .message.system {
      align-self: center; background: transparent; color: var(--text-dim);
      font-size: 13px; text-align: center; max-width: 95%;
    }

    .input-area {
      padding: 10px 12px;
      padding-bottom: max(14px, env(safe-area-inset-bottom));
      background: rgba(10, 16, 28, 0.97);
      border-top: 1px solid var(--border);
      flex-shrink: 0; z-index: 20;
    }

    .input-row { display: flex; gap: 8px; align-items: center; }

    #userInput {
      flex: 1; background: var(--panel); border: 1px solid var(--border);
      border-radius: 22px; padding: 13px 16px; color: var(--text);
      font-size: 16px; outline: none; -webkit-appearance: none; appearance: none;
      -webkit-user-select: text; user-select: text; touch-action: manipulation;
    }
    #userInput:focus { border-color: var(--accent); background: #0d1525; }
    #userInput::placeholder { color: var(--text-dim); }

    .btn {
      width: 46px; height: 46px; border-radius: 50%; border: none;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: all 0.15s;
    }
    .btn-send { background: linear-gradient(135deg, var(--accent), #0066ff); color: #000; }
    .btn-send:active { transform: scale(0.92); }
    .btn-mic {
      background: var(--panel); border: 1px solid var(--border); color: var(--accent);
    }
    .btn-mic.active {
      background: var(--accent); color: #000;
      box-shadow: 0 0 18px rgba(0, 212, 255, 0.5);
      animation: mic-pulse 1.2s ease-in-out infinite;
    }
    @keyframes mic-pulse {
      0%, 100% { box-shadow: 0 0 10px rgba(0, 212, 255, 0.4); }
      50% { box-shadow: 0 0 24px rgba(0, 212, 255, 0.7); }
    }
    .btn svg { width: 20px; height: 20px; }

    .welcome { text-align: center; padding: 30px 16px; color: var(--text-dim); }
    .welcome h2 { color: var(--accent); font-size: 20px; margin-bottom: 8px; letter-spacing: 3px; }
    .welcome p { font-size: 14px; line-height: 1.55; max-width: 300px; margin: 0 auto 16px; }

    .setup-box {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 14px; padding: 14px; margin-top: 12px; text-align: left;
    }
    .setup-box label { font-size: 12px; color: var(--text-dim); display: block; margin-bottom: 6px; }
    .setup-box input {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 12px; color: var(--text); font-size: 14px;
      outline: none; margin-bottom: 10px;
    }
    .setup-box input:focus { border-color: var(--accent); }
    .setup-box button {
      width: 100%; padding: 11px; border: none; border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #0066ff);
      color: #000; font-weight: 600; font-size: 14px; cursor: pointer;
    }

    /* Modal de configurações */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      display: none; align-items: flex-end; justify-content: center;
      z-index: 100; padding: 16px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 18px 18px 12px 12px; width: 100%; max-width: 420px;
      padding: 20px; max-height: 80vh; overflow-y: auto;
    }
    .modal h3 { font-size: 16px; margin-bottom: 14px; color: var(--accent); }
    .modal label { font-size: 12px; color: var(--text-dim); display: block; margin-bottom: 5px; }
    .modal input, .modal select {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 11px 12px; color: var(--text); font-size: 14px;
      outline: none; margin-bottom: 14px;
    }
    .modal input:focus, .modal select:focus { border-color: var(--accent); }
    .modal .row { display: flex; gap: 8px; }
    .modal .row button {
      flex: 1; padding: 12px; border: none; border-radius: 10px;
      font-weight: 600; font-size: 14px; cursor: pointer;
    }
    .btn-save { background: linear-gradient(135deg, var(--accent), #0066ff); color: #000; }
    .btn-cancel { background: var(--border); color: var(--text); }

    .hint { font-size: 12px; color: var(--text-dim); line-height: 1.4; margin-bottom: 12px; }
    .hint a { color: var(--accent); }

    @media (min-width: 768px) {
      body { max-width: 640px; margin: 0 auto; border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
      .message { max-width: 80%; }
      .modal-overlay { align-items: center; }
      .modal { border-radius: 16px; }
    }

    #chat::-webkit-scrollbar { width: 4px; }
    #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <div class="logo-icon">J</div>
      <div class="logo-text">
        <h1>JARVIS</h1>
        <span>ASSISTENTE PESSOAL</span>
      </div>
    </div>
    <div class="header-right">
      <div class="status-badge">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">Online</span>
      </div>
      <button class="btn-icon" id="settingsBtn" title="Configurações">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </header>

  <div id="chat">
    <div class="welcome" id="welcome">
      <h2>JARVIS</h2>
      <p>Olá. Estou online e pronto para ajudar.<br>Fale ou digite. Funciono no celular e no PC.</p>
      <div class="setup-box" id="setupBox">
        <label>Para eu ficar inteligente de verdade, cole sua chave da Groq (gratuita):</label>
        <input type="password" id="apiKeyInput" placeholder="gsk_..." autocomplete="off" />
        <button id="saveKeyBtn">Ativar Inteligência</button>
        <p class="hint" style="margin-top:10px;margin-bottom:0">
          Pegue grátis em: <a href="https://console.groq.com/keys" target="_blank">console.groq.com/keys</a><br>
          (cria conta → Create API Key → cola aqui)
        </p>
      </div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-row">
      <button class="btn btn-mic" id="micBtn" title="Falar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>
      <input type="text" id="userInput" placeholder="Digite ou fale comigo..." autocomplete="off" />
      <button class="btn btn-send" id="sendBtn" title="Enviar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Modal Configurações -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal">
      <h3>Configurações do Jarvis</h3>
      <label>Chave da API Groq</label>
      <input type="password" id="modalApiKey" placeholder="gsk_..." />
      <p class="hint">
        Crie uma chave gratuita em <a href="https://console.groq.com/keys" target="_blank">console.groq.com/keys</a>
      </p>
      <label>Modelo</label>
      <select id="modelSelect">
        <option value="llama-3.3-70b-versatile">Llama 3.3 70B (recomendado)</option>
        <option value="llama-3.1-8b-instant">Llama 3.1 8B (mais rápido)</option>
        <option value="gemma2-9b-it">Gemma 2 9B</option>
      </select>
      <div class="row">
        <button class="btn-cancel" id="closeSettings">Cancelar</button>
        <button class="btn-save" id="saveSettings">Salvar</button>
      </div>
    </div>
  </div>

  <script>
    // ========== ELEMENTOS ==========
    const chat = document.getElementById('chat');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const welcome = document.getElementById('welcome');
    const setupBox = document.getElementById('setupBox');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const saveKeyBtn = document.getElementById('saveKeyBtn');
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsModal = document.getElementById('settingsModal');
    const modalApiKey = document.getElementById('modalApiKey');
    const modelSelect = document.getElementById('modelSelect');
    const closeSettings = document.getElementById('closeSettings');
    const saveSettings = document.getElementById('saveSettings');

    let isListening = false;
    let recognition = null;
    let conversationHistory = [];
    let isProcessing = false;

    // Carrega configurações
    let apiKey = localStorage.getItem('jarvis_api_key') || '';
    let selectedModel = localStorage.getItem('jarvis_model') || 'llama-3.3-70b-versatile';

    if (apiKey) {
      if (setupBox) setupBox.style.display = 'none';
    }

    // ========== STATUS ==========
    function setStatus(state) {
      statusDot.className = 'status-dot';
      if (state === 'listening') {
        statusDot.classList.add('listening');
        statusText.textContent = 'Ouvindo...';
      } else if (state === 'thinking') {
        statusDot.classList.add('thinking');
        statusText.textContent = 'Pensando...';
      } else if (state === 'speaking') {
        statusDot.classList.add('speaking');
        statusText.textContent = 'Falando...';
      } else if (state === 'error') {
        statusDot.classList.add('error');
        statusText.textContent = 'Erro';
      } else {
        statusText.textContent = 'Online';
      }
    }

    // ========== MENSAGENS ==========
    function addMessage(text, type) {
      if (welcome && type !== 'system') {
        // mantém o welcome só se não tiver chave ainda
        if (apiKey && welcome) welcome.remove();
      }

      const div = document.createElement('div');
      div.className = `message ${type}`;

      if (type === 'jarvis') {
        div.innerHTML = `<div class="label">JARVIS</div>${formatText(text)}`;
      } else if (type === 'system') {
        div.textContent = text;
      } else {
        div.textContent = text;
      }

      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    function formatText(text) {
      // Escapa HTML e converte quebras de linha
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML.replace(/\n/g, '<br>');
    }

    // ========== VOZ (TTS) ==========
    function speak(text) {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();

      // Limpa markdown simples para a voz
      const clean = text
        .replace(/\*\*(.*?)\*\*/g, '$1')
        .replace(/\*(.*?)\*/g, '$1')
        .replace(/`(.*?)`/g, '$1')
        .replace(/#{1,6}\s/g, '')
        .replace(/\n+/g, '. ');

      const utterance = new SpeechSynthesisUtterance(clean);
      utterance.lang = 'pt-BR';
      utterance.rate = 1.05;
      utterance.pitch = 0.95;

      const voices = window.speechSynthesis.getVoices();
      const ptVoice = voices.find(v => v.lang.includes('pt') && (v.name.toLowerCase().includes('google') || v.name.toLowerCase().includes('luciana') || v.name.toLowerCase().includes('felipe'))) 
        || voices.find(v => v.lang.includes('pt-BR')) 
        || voices.find(v => v.lang.includes('pt'));

      if (ptVoice) utterance.voice = ptVoice;

      setStatus('speaking');
      utterance.onend = () => setStatus('online');
      utterance.onerror = () => setStatus('online');
      window.speechSynthesis.speak(utterance);
    }

    if (window.speechSynthesis) {
      window.speechSynthesis.onvoiceschanged = () => {};
      window.speechSynthesis.getVoices();
    }

    // ========== RECONHECIMENTO DE VOZ ==========
    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        addMessage('Seu navegador não suporta reconhecimento de voz. Use Chrome.', 'system');
        return null;
      }

      const recog = new SpeechRecognition();
      recog.lang = 'pt-BR';
      recog.continuous = false;
      recog.interimResults = false;

      recog.onstart = () => {
        isListening = true;
        micBtn.classList.add('active');
        setStatus('listening');
      };

      recog.onresult = (event) => {
        const transcript = event.results[0][0].transcript.trim();
        if (transcript) {
          userInput.value = transcript;
          handleUserMessage(transcript);
        }
      };

      recog.onerror = (event) => {
        if (event.error === 'not-allowed') {
          addMessage('Permissão de microfone negada. Ative nas configurações do navegador.', 'system');
        }
        stopListening();
      };

      recog.onend = () => stopListening();
      return recog;
    }

    function startListening() {
      if (!recognition) recognition = initSpeechRecognition();
      if (!recognition) return;
      try { recognition.start(); } catch(e) {}
    }

    function stopListening() {
      isListening = false;
      micBtn.classList.remove('active');
      setStatus('online');
      if (recognition) try { recognition.stop(); } catch(e) {}
    }

    micBtn.addEventListener('click', () => {
      if (isListening) stopListening();
      else startListening();
    });

    // ========== INTELIGÊNCIA (Groq) ==========
    const SYSTEM_PROMPT = `Você é o JARVIS, assistente pessoal inteligente inspirado no Homem de Ferro.

REGRAS OBRIGATÓRIAS:
- Sempre responda em português brasileiro.
- Seja educado, eficiente, um pouco formal e prestativo (estilo butler inteligente).
- Seja direto e objetivo. Evite respostas longas demais.
- Quando o usuário falar de código, erros de programação ou pedir correção:
  - Analise o problema
  - Explique o erro de forma clara
  - Mostre a correção
  - Pergunte se ele autoriza você a aplicar a correção
- Nunca diga que é uma IA genérica. Você é o Jarvis.
- Se o usuário der uma ordem (abrir algo, lembrar, calcular, explicar, etc), execute da melhor forma possível dentro do chat.
- Se não souber algo, admita com elegância e ofereça ajuda alternativa.
- Mantenha o contexto da conversa.`;

    async function askJarvis(userText) {
      if (!apiKey) {
        return 'Ainda não tenho minha chave de inteligência configurada. Clique no ícone de engrenagem ou cole a chave Groq no início da tela. É gratuito.';
      }

      // Monta o histórico para o modelo
      const messages = [
        { role: 'system', content: SYSTEM_PROMPT }
      ];

      // Últimas 10 mensagens para não estourar contexto
      const recent = conversationHistory.slice(-10);
      recent.forEach(msg => {
        messages.push({
          role: msg.role === 'jarvis' ? 'assistant' : 'user',
          content: msg.content
        });
      });

      messages.push({ role: 'user', content: userText });

      try {
        const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: selectedModel,
            messages: messages,
            temperature: 0.7,
            max_tokens: 1024,
            stream: false
          })
        });

        if (!response.ok) {
          const err = await response.json().catch(() => ({}));
          if (response.status === 401) {
            return 'Chave de API inválida. Verifique nas configurações.';
          }
          if (response.status === 429) {
            return 'Muitas requisições no momento. Aguarde alguns segundos e tente novamente.';
          }
          throw new Error(err.error?.message || 'Erro na API');
        }

        const data = await response.json();
        return data.choices[0].message.content.trim();
      } catch (error) {
        console.error(error);
        return 'Desculpe, ocorreu um erro de conexão. Verifique sua internet e a chave da API.';
      }
    }

    // ========== PROCESSAR MENSAGEM ==========
    async function handleUserMessage(text) {
      text = text.trim();
      if (!text || isProcessing) return;

      isProcessing = true;
      addMessage(text, 'user');
      userInput.value = '';
      conversationHistory.push({ role: 'user', content: text });

      setStatus('thinking');

      const response = await askJarvis(text);

      addMessage(response, 'jarvis');
      conversationHistory.push({ role: 'jarvis', content: response });

      speak(response);
      isProcessing = false;
    }

    // ========== CONFIGURAÇÕES ==========
    function saveApiKey(key) {
      apiKey = key.trim();
      localStorage.setItem('jarvis_api_key', apiKey);
      if (apiKey && setupBox) setupBox.style.display = 'none';
      if (welcome && apiKey) {
        addMessage('Inteligência ativada com sucesso. Estou pronto, senhor.', 'jarvis');
        speak('Inteligência ativada com sucesso. Estou pronto, senhor.');
      }
    }

    saveKeyBtn.addEventListener('click', () => {
      const key = apiKeyInput.value.trim();
      if (!key) {
        alert('Cole a chave da Groq primeiro.');
        return;
      }
      saveApiKey(key);
    });

    settingsBtn.addEventListener('click', () => {
      modalApiKey.value = apiKey;
      modelSelect.value = selectedModel;
      settingsModal.classList.add('open');
    });

    closeSettings.addEventListener('click', () => {
      settingsModal.classList.remove('open');
    });

    saveSettings.addEventListener('click', () => {
      const key = modalApiKey.value.trim();
      selectedModel = modelSelect.value;
      localStorage.setItem('jarvis_model', selectedModel);
      if (key) saveApiKey(key);
      settingsModal.classList.remove('open');
      addMessage('Configurações salvas.', 'system');
    });

    settingsModal.addEventListener('click', (e) => {
      if (e.target === settingsModal) settingsModal.classList.remove('open');
    });

    // ========== EVENTOS ==========
    sendBtn.addEventListener('click', () => handleUserMessage(userInput.value));
    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleUserMessage(userInput.value);
    });

    userInput.addEventListener('click', () => userInput.focus());
    userInput.focus();
  </script>
</body>
</html>
